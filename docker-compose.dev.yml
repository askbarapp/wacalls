services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wacalls
      POSTGRES_USER: wacalls
      POSTGRES_PASSWORD: wacalls
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wacalls"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    environment:
      APP_ENV: development
      CALLING_ENGINE: mock
      DATABASE_URL: postgresql://wacalls:wacalls@postgres:5432/wacalls?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: development-jwt-secret-do-not-use-in-prod
      ENCRYPTION_KEY: development-encryption-key-32b
      INTERNAL_TOKEN: dev-internal-token
      CORS_ORIGINS: http://localhost:3000
      WHATSAPP_URL: http://whatsapp:4010
      API_PORT: 3001
      LOG_LEVEL: debug
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://wacalls:wacalls@postgres:5432/wacalls?schema=public
      REDIS_URL: redis://redis:6379
      INTERNAL_TOKEN: dev-internal-token
      WHATSAPP_URL: http://whatsapp:4010
    depends_on:
      - api

  whatsapp:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: whatsapp
    environment:
      APP_ENV: development
      CALLING_ENGINE: mock
      DATABASE_URL: postgresql://wacalls:wacalls@postgres:5432/wacalls?schema=public
      REDIS_URL: redis://redis:6379
      INTERNAL_TOKEN: dev-internal-token
      SESSION_DIR: /data/sessions
      WHATSAPP_PORT: 4010
    volumes:
      - whatsapp_sessions_dev:/data/sessions
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001/ws
    ports:
      - "3000:3000"

volumes:
  postgres_data_dev:
  whatsapp_sessions_dev:
