services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WHATSAPP_URL: http://whatsapp:4010
    volumes:
      - recordings:/data/recordings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WHATSAPP_URL: http://whatsapp:4010
      RECORDINGS_DIR: /data/recordings
    volumes:
      - recordings:/data/recordings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  whatsapp:
    build:
      context: ./services/wa-native
      dockerfile: Dockerfile.bridge
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      WHATSAPP_PORT: "4010"
      RECORDINGS_DIR: /data/recordings
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_IP: ${PUBLIC_IP:-}
      ICE_UDP_PORT_MIN: "10000"
      ICE_UDP_PORT_MAX: "10031"
    ports:
      - "10000-10031:10000-10031/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - recordings:/data/recordings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    env_file: .env
    networks: [internal]

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot-www:/var/www/certbot
      - ./certbot-certs:/etc/letsencrypt
    depends_on:
      - web
      - api
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
  whatsapp_sessions:
  recordings:

networks:
  internal:
    driver: bridge
