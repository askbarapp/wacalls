# Local Windows/macOS testing — does NOT bind port 80/443 (safe alongside XAMPP).
# Real WhatsApp QR (CALLING_ENGINE=selfhosted). Do not use this file on the VPS.
#
#   docker compose -f docker-compose.local.yml up --build
#   then migrate + seed (see scripts/local-up.ps1)
#
# Open http://localhost:3000/login
# admin@localhost / LocalDev!2345

x-local-env: &local-env
  APP_ENV: development
  APP_URL: http://localhost:3000
  LOG_LEVEL: debug
  CALLING_ENGINE: selfhosted
  DATABASE_URL: postgresql://wacalls:wacalls@postgres:5432/wacalls?schema=public
  REDIS_URL: redis://redis:6379
  JWT_SECRET: local-dev-jwt-secret-do-not-use-in-production
  ENCRYPTION_KEY: local-dev-encryption-key-32chars
  INTERNAL_TOKEN: local-dev-internal-token
  CORS_ORIGINS: http://localhost:3000
  WHATSAPP_URL: http://whatsapp:4010
  API_PORT: "3001"
  SESSION_DIR: /data/sessions
  RECORDINGS_DIR: /data/recordings
  ADMIN_EMAIL: admin@localhost
  ADMIN_PASSWORD: LocalDev!2345
  ADMIN_ORG_NAME: WaCalls

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wacalls
      POSTGRES_USER: wacalls
      POSTGRES_PASSWORD: wacalls
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wacalls -d wacalls"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      <<: *local-env
    ports:
      - "3001:3001"
    volumes:
      - recordings_local:/data/recordings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      <<: *local-env
    volumes:
      - recordings_local:/data/recordings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  whatsapp:
    build:
      context: ./services/wa-native
      dockerfile: Dockerfile.bridge
    restart: unless-stopped
    environment:
      <<: *local-env
      WHATSAPP_PORT: "4010"
      ICE_UDP_PORT_MIN: "10000"
      ICE_UDP_PORT_MAX: "10031"
    ports:
      - "10000-10031:10000-10031/udp"
    volumes:
      - recordings_local:/data/recordings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_WS_URL: ws://localhost:3001/ws
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001/ws
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data_local:
  whatsapp_sessions_local:
  recordings_local:
